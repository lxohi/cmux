name: Fork macOS CI

# Runs on GitHub-hosted macos-latest (free for public-repo forks).
# Mirrors the warp-macos-* jobs in ci.yml but uses runners the fork
# has access to. Triggered on every push to any branch in this fork,
# and on workflow_dispatch.

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  package-tests:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: swift test on CmuxTerminalAccess (leaf package)
        working-directory: Packages/CmuxTerminalAccess
        run: swift test --parallel

  app-target-build-and-test:
    # cmux uses Swift 6 features (file-level `nonisolated`, etc.) that
    # require Xcode 26 / Swift 6.x. GitHub-hosted macos-latest currently
    # ships Xcode 16. This job runs only if Xcode 26 is present on the
    # runner; otherwise it skips with a clear message rather than
    # spamming a long red log.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Detect Xcode 26
        id: xcode26
        run: |
          set +e
          XCODE26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort | tail -1)
          if [ -z "$XCODE26" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Xcode 26 not installed on this runner — app-target build skipped. Available Xcodes:"
            ls /Applications | grep -i Xcode || true
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "path=$XCODE26" >> "$GITHUB_OUTPUT"
          sudo xcode-select -s "$XCODE26/Contents/Developer"
          xcodebuild -version

      - name: Restore zig cache
        if: steps.xcode26.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-packages-${{ hashFiles('ghostty/build.zig.zon') }}
          restore-keys: zig-packages-

      - name: Install zig (pinned 0.15.2)
        if: steps.xcode26.outputs.skip == 'false'
        run: ./scripts/install-zig-ci.sh

      - name: Ensure GhosttyKit.xcframework
        if: steps.xcode26.outputs.skip == 'false'
        run: ./scripts/ensure-ghosttykit.sh
        timeout-minutes: 30

      - name: Resolve Swift package dependencies
        if: steps.xcode26.outputs.skip == 'false'
        run: |
          xcodebuild -project cmux.xcodeproj -scheme cmux-unit \
            -configuration Debug \
            -clonedSourcePackagesDirPath /tmp/cmux-fork-spm \
            -resolvePackageDependencies

      - name: Build cmux app target (debug)
        if: steps.xcode26.outputs.skip == 'false'
        run: |
          xcodebuild -project cmux.xcodeproj -scheme cmux-unit \
            -configuration Debug \
            -clonedSourcePackagesDirPath /tmp/cmux-fork-spm \
            -disableAutomaticPackageResolution \
            -destination 'platform=macOS' \
            -derivedDataPath /tmp/cmux-fork-derived \
            CMUX_SKIP_ZIG_BUILD=1 \
            build-for-testing

      - name: Run cmux-unit tests (integration suite)
        if: steps.xcode26.outputs.skip == 'false'
        run: |
          xcodebuild -project cmux.xcodeproj -scheme cmux-unit \
            -configuration Debug \
            -clonedSourcePackagesDirPath /tmp/cmux-fork-spm \
            -disableAutomaticPackageResolution \
            -destination 'platform=macOS' \
            -derivedDataPath /tmp/cmux-fork-derived \
            CMUX_SKIP_ZIG_BUILD=1 \
            test-without-building
